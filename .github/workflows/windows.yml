name: Windows validation
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore YuGiOhOverlay.sln
      - name: Build
        run: dotnet build YuGiOhOverlay.sln -c Release --no-restore -warnaserror
      - name: Core and adapter tests
        run: dotnet test YuGiOhOverlay.Domain.Tests -c Release --no-build --logger trx
      - name: Native recognition tests (synthetic images, no screen capture)
        run: dotnet test YuGiOhOverlay.Vision.Tests -c Release --no-build --logger trx
      - name: WPF guide selection regression tests
        run: dotnet test YuGiOhOverlay.UI.Tests -c Release --no-build --logger trx
      - name: Verify formatting
        run: dotnet format whitespace YuGiOhOverlay.sln --verify-no-changes --no-restore --exclude YuGiOhOverlay.UI/LegacyOverlayWindow.xaml.cs YuGiOhOverlay.UI/AssemblyInfo.cs YuGiOhOverlay.UI/CardListItem.cs YuGiOhOverlay.Infrastructure/JsonDataStore.cs YuGiOhOverlay.Infrastructure/SettingsStore.cs YuGiOhOverlay.Domain/AppSettings.cs YuGiOhOverlay.Domain/DeckModels.cs YuGiOhOverlay.Domain.Tests/UnitTest1.cs
      - name: Publish Windows x64 application
        run: dotnet publish YuGiOhOverlay.UI/YuGiOhOverlay.UI.csproj -c Release -r win-x64 -o artifacts/windows-x64 -p:DebugType=None -p:DebugSymbols=false
      - name: Launch and close the published executable
        shell: pwsh
        run: ./scripts/Test-PublishedStartup.ps1 -Executable ./artifacts/windows-x64/YuGiOhOverlay.UI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: YuGiOhOverlay-windows-x64
          path: artifacts/windows-x64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
